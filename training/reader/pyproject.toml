[project]
name = "gigsync-reader-training"
version = "0.1.0"
description = "Trains and exports the phone's reader (ADR 0065): multilingual-e5-small with a turn head and a span tagger."
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.8",
  "transformers>=4.56,<5",
  "sentencepiece>=0.2",
  "protobuf>=5",
  "onnx>=1.18",
  "onnxruntime>=1.22",
  "numpy>=2",
]

[tool.uv]
package = false
