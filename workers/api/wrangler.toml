name = "gigsync-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain on the gigsync.network zone. Cloudflare creates the DNS record and certificate on deploy.
routes = [{ pattern = "api.gigsync.network", custom_domain = true }]
workers_dev = true

# Directory: users, devices, keys, phone hashes, sessions, in Neon Postgres (ADR 0013), reached through Hyperdrive.
# Create with `wrangler hyperdrive create gigsync-directory --connection-string="$DATABASE_URL_UNPOOLED"` (the
# direct URL: Hyperdrive pools by itself) and paste the id below. Migrations: infra/postgres/directory.
# Local dev never uses the id: wrangler dev connects to CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_DIRECTORY.
[[hyperdrive]]
binding = "DIRECTORY"
id = "8ab7b3197cf14c4eac5c17ab6f0b75fa"

# One Durable Object per user, class from workers/mailbox, re-exported from src/index.ts.
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

# Sign-in attempts per client IP, counted per Cloudflare location. The per-number cap is in D1 (otp_attempts).
[[ratelimits]]
name = "OTP_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Geocoding lookups per user (ADR 0045): a person filling in an address needs a handful, not hundreds.
[[ratelimits]]
name = "GEO_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Board searches per user (agreed 2026-11-18): plenty for a person asking, too few to copy the board.
[[ratelimits]]
name = "SEARCH_RATE_LIMIT"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

# One deployment for the pilot. Split into staging and production when there is a team.
[vars]
ENVIRONMENT = "pilot"
# Requests and events only; private values print as [redacted]. Local runs override both in .dev.vars.
LOG_LEVEL = "info"
LOG_PII = "false"
# Who may call the API from a browser: the website, then the iOS and Android webviews (capacitor://localhost,
# https://localhost). Local dev overrides this in .dev.vars.
ALLOWED_ORIGINS = "https://gigsync.network,https://www.gigsync.network,capacitor://localhost,https://localhost"
# DEV_OTP is a secret, not a var: a code that verifies for every number, for local work and tests. Once the API sends
# codes itself (WhatsApp below, or SMS through MSG91 with the MSG91_AUTH_KEY and MSG91_OTP_TEMPLATE_ID secrets) it no
# longer signs anyone in; delete it from production then.
# Local dev reads it from .dev.vars (see .dev.vars.example); the deployed Worker from `wrangler secret put DEV_OTP`.
# Real SMS codes through Firebase phone sign-in: the Firebase project id (public; it is in every ID token). Empty
# means phone sign-in is off and only DEV_OTP signs in. Setup: docs/setup/firebase-phone-sign-in.md.
FIREBASE_PROJECT_ID = ""
# Sign-in codes by WhatsApp (ADR 0069, docs/setup/whatsapp-otp.md): the id Meta gives the sending number, and the
# approved authentication template's name. With both set and the WHATSAPP_TOKEN secret put, the API sends the codes
# and DEV_OTP stops signing in. Empty means off.
WHATSAPP_PHONE_NUMBER_ID = ""
WHATSAPP_TEMPLATE = ""
# Live cities (README "Live cities"): Bengaluru alone for the pilot, though the directory also has Kanpur. A comma
# list keeps only those cities; unset serves every live city in the directory; "*" lets every place in, for testing
# from anywhere (Sitapur): set LIVE_CITIES=* in .dev.vars, which wins over this locally.
LIVE_CITIES = "bengaluru"
# Job alerts (ADR 0043): the public half of the VAPID pair, which every phone subscribes with, and the contact the
# push services may write to. The private half is `wrangler secret put VAPID_PRIVATE_KEY`; without it, no alerts.
VAPID_PUBLIC_KEY = "BCViIeyH1H-yLP9j37xoSZfgGJI91upzAJWrgLqDMgtLQzLYLw7FoUBiic1AZ-jyAPW_jIpUb6jPvsuzY5W65ls"
VAPID_SUBJECT = "mailto:ops@gigsync.network"

# Workers Logs: console output and request details, searchable in the dashboard (Observability).
[observability]
enabled = true
head_sampling_rate = 1
