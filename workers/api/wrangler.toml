name = "collab-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain: Cloudflare creates the DNS record and certificate on deploy.
routes = [{ pattern = "api.collabai.network", custom_domain = true }]
# Keep the *.workers.dev address too (wrangler turns it off when routes are set).
workers_dev = true

# Directory: users, devices, keys, phone hashes, sessions. Create with `wrangler d1 create collab-directory`
# and paste the id below for each environment.
[[d1_databases]]
binding = "DIRECTORY"
database_name = "collab-directory"
database_id = "d0ca0057-445e-4f39-b1fc-aa652b35d1a7"
migrations_dir = "../../infra/wrangler/d1/directory"

# One Durable Object per user, class from workers/mailbox, re-exported from src/index.ts.
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

# Sign-in attempts per client IP, counted per Cloudflare location. The per-number cap is in D1 (otp_attempts).
[[ratelimits]]
name = "OTP_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# One deployment for the pilot. Split into staging and production when there is a team.
[vars]
ENVIRONMENT = "pilot"
# Who may call the API from a browser: the website, then the iOS and Android webviews (capacitor://localhost,
# https://localhost). Local dev overrides this in .dev.vars.
ALLOWED_ORIGINS = "https://collabai.network,https://www.collabai.network,https://collab-app.collab-index-worker.workers.dev,capacitor://localhost,https://localhost"
# DEV_OTP is a secret, not a var: the code that always verifies until the SMS gateway exists.
# Local dev reads it from .dev.vars (see .dev.vars.example); the deployed Worker from `wrangler secret put DEV_OTP`.
