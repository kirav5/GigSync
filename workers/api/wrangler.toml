name = "collab-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Directory: users, devices, keys, phone hashes, sessions. Create with `wrangler d1 create collab-directory`
# and paste the id below for each environment.
[[d1_databases]]
binding = "DIRECTORY"
database_name = "collab-directory"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../infra/wrangler/d1/directory"

# One Durable Object per user, class from workers/mailbox, re-exported from src/index.ts.
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

[vars]
ENVIRONMENT = "dev"
# Dev only: the OTP that always verifies. Unset in staging and production.
DEV_OTP = "000000"

[env.staging]
name = "collab-api-staging"
vars = { ENVIRONMENT = "staging" }

[env.production]
name = "collab-api"
vars = { ENVIRONMENT = "production" }
