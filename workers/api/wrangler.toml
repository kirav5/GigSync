name = "gigsync-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain: uncomment once the GigSync domain is chosen and in this Cloudflare account (gigsync.app is a
# placeholder). Cloudflare creates the DNS record and certificate on deploy.
# routes = [{ pattern = "api.gigsync.app", custom_domain = true }]
workers_dev = true

# Directory: users, devices, keys, phone hashes, sessions. Create with `wrangler d1 create gigsync-directory`
# and paste the id below for each environment.
[[d1_databases]]
binding = "DIRECTORY"
database_name = "gigsync-directory"
# Placeholder: replace with the id from `wrangler d1 create gigsync-directory` (never reuse Collab's database).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../infra/wrangler/d1/directory"

# One Durable Object per user, class from workers/mailbox, re-exported from src/index.ts.
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

# Sign-in attempts per client IP, counted per Cloudflare location. The per-number cap is in D1 (otp_attempts).
[[ratelimits]]
name = "OTP_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# One deployment for the pilot. Split into staging and production when there is a team.
[vars]
ENVIRONMENT = "pilot"
# Requests and events only; private values print as [redacted]. Local runs override both in .dev.vars.
LOG_LEVEL = "info"
LOG_PII = "false"
# Who may call the API from a browser: the website, then the iOS and Android webviews (capacitor://localhost,
# https://localhost). Local dev overrides this in .dev.vars.
ALLOWED_ORIGINS = "https://gigsync.app,https://www.gigsync.app,https://gigsync-app.gigsync.workers.dev,capacitor://localhost,https://localhost"
# DEV_OTP is a secret, not a var: the code that always verifies until the SMS gateway exists.
# Local dev reads it from .dev.vars (see .dev.vars.example); the deployed Worker from `wrangler secret put DEV_OTP`.

# Workers Logs: console output and request details, searchable in the dashboard (Observability).
[observability]
enabled = true
head_sampling_rate = 1
