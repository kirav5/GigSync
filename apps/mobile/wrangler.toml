# The web build of the app, served as static assets by a Worker (Cloudflare Pages now runs on Workers).
# Deploy: pnpm build && pnpm --filter @collab/worker-api exec wrangler deploy --config ../../apps/mobile/wrangler.toml
name = "collab-app"
compatibility_date = "2026-08-01"

# Custom domains: Cloudflare creates the DNS records and certificates on deploy.
routes = [
  { pattern = "collabai.network", custom_domain = true },
  { pattern = "www.collabai.network", custom_domain = true },
]
# Keep the *.workers.dev address too (wrangler turns it off when routes are set).
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Workers Logs: console output and request details, searchable in the dashboard (Observability).
[observability]
enabled = true
head_sampling_rate = 1
