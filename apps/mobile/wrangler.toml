# The web build of the app, served as static assets by a Worker (Cloudflare Pages now runs on Workers).
# Deploy: pnpm build && pnpm --filter @gigsync/worker-api exec wrangler deploy --config ../../apps/mobile/wrangler.toml
name = "gigsync-app"
compatibility_date = "2026-08-01"

# Custom domains: uncomment once the GigSync domain is chosen and in this Cloudflare account (gigsync.app is a
# placeholder). Cloudflare creates the DNS records and certificates on deploy.
# routes = [
#   { pattern = "gigsync.app", custom_domain = true },
#   { pattern = "www.gigsync.app", custom_domain = true },
# ]
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Workers Logs: console output and request details, searchable in the dashboard (Observability).
[observability]
enabled = true
head_sampling_rate = 1
