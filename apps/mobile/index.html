<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>GigSync</title>
    <meta name="description" content="A gig worker's own AI assistant: agrees the job, holds back their number, keeps the signed record of their work and pay." />
    <!-- One theme-color, the page's cream background: GigSync is light only (ui/look.ts). -->
    <meta name="theme-color" content="#faf6ee" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GigSync" />
    <!-- The first frame, painted before any script: the cream paper of the opening (ui/LaunchSun.tsx, launch.css), so a
         launch never shows a white page. The colour is the app's --bg (styles.css), written out because no stylesheet
         has loaded yet; the manifest's background_color matches it. LaunchSun draws the same paper over it and removes it;
         with Reduce Motion there is no opening, so the page's own cream shows instead. -->
    <style>
      html,
      body {
        margin: 0;
        background: #faf6ee;
      }
      #launch-static {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #faf6ee;
      }
      @media (prefers-reduced-motion: reduce) {
        #launch-static {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="launch-static" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
