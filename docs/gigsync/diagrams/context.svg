<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="GigSync: who uses it and what it talks to">
<title>GigSync: who uses it and what it talks to</title>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker>
</defs>
<rect width="1180" height="560" fill="#f7f7f5"/>
<text x="24" y="34" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#0a0a0a" text-anchor="start">GigSync: who uses it and what it talks to</text>
<rect x="30" y="80" width="180" height="60" rx="6" fill="#ffe4f1" stroke="#c4126e" stroke-width="1.2"/><text x="42" y="102" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Gig worker</text><text x="42" y="121" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">voice or taps</text><rect x="30" y="250" width="180" height="60" rx="6" fill="#ffe4f1" stroke="#c4126e" stroke-width="1.2"/><text x="42" y="272" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Consumer</text><text x="42" y="291" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">needs the work done</text><rect x="30" y="420" width="180" height="60" rx="6" fill="#ffe4f1" stroke="#c4126e" stroke-width="1.2"/><text x="42" y="442" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Union organiser</text><text x="42" y="461" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">supports workers</text><rect x="290" y="73" width="230" height="74" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="302" y="95" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Worker's GigSync app</text><text x="302" y="114" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">their own agent, on their phone</text><rect x="290" y="243" width="230" height="74" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="302" y="265" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Consumer's GigSync app</text><text x="302" y="284" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">the consumer's own agent</text><rect x="290" y="413" width="230" height="74" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="302" y="435" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">GigSync in union mode</text><text x="302" y="454" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">same app, usually a browser</text><line x1="210" y1="110" x2="290" y2="110" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><line x1="210" y1="280" x2="290" y2="280" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><line x1="210" y1="450" x2="290" y2="450" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><rect x="600" y="215" width="250" height="130" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="1.2" stroke-dasharray="6 4"/><text x="612" y="237" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">GigSync cloud</text><text x="612" y="256" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">API · one mailbox per user</text><text x="612" y="273" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">notifier · job board</text><text x="612" y="290" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">passes locked messages only</text><line x1="520" y1="124" x2="600" y2="240" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><text x="560" y="175" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">sealed</text><line x1="520" y1="280" x2="600" y2="280" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><text x="560" y="273" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">sealed</text><line x1="520" y1="440" x2="600" y2="322" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><text x="498" y="385" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">sealed evidence packs</text><rect x="930" y="60" width="230" height="64" rx="6" fill="#efefec" stroke="#cfcfc9" stroke-width="1.2"/><text x="942" y="82" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Helpline, welfare board</text><text x="942" y="101" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">only fields the worker picks</text><rect x="930" y="150" width="230" height="64" rx="6" fill="#efefec" stroke="#cfcfc9" stroke-width="1.2"/><text x="942" y="172" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">AT Protocol (Bluesky)</text><text x="942" y="191" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">public profile, open jobs</text><rect x="930" y="250" width="230" height="64" rx="6" fill="#efefec" stroke="#cfcfc9" stroke-width="1.2"/><text x="942" y="272" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Push (FCM / APNs)</text><text x="942" y="291" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">wake-up with no content</text><rect x="930" y="350" width="230" height="64" rx="6" fill="#efefec" stroke="#cfcfc9" stroke-width="1.2"/><text x="942" y="372" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">ONDC network</text><text x="942" y="391" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">rides and delivery jobs</text><line x1="520" y1="88" x2="930" y2="92" stroke="#0a0a0a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="725" y="83" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">consented export</text><line x1="520" y1="104" x2="930" y2="182" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="725" y="136" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">public profile</text><line x1="850" y1="282" x2="930" y2="282" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><line x1="850" y1="322" x2="930" y2="382" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><text x="916" y="345" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">relay</text><text x="30" y="535" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6b66" text-anchor="start">Pink: people · Ink: the GigSync app · Dashed: GigSync cloud, which never reads private data · Grey: outside systems</text>
</svg>
