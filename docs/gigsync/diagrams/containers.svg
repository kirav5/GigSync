<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-label="GigSync: containers">
<title>GigSync: containers</title>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker>
</defs>
<rect width="1180" height="640" fill="#f7f7f5"/>
<text x="24" y="34" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#0a0a0a" text-anchor="start">GigSync: containers</text>
<rect x="20" y="56" width="600" height="560" rx="8" fill="none" stroke="#6b6b66" stroke-width="1"/><text x="34" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b6b66" text-anchor="start" letter-spacing="0.06em">GIGSYNC APP: ANDROID · IPHONE/MAC · WEB</text><rect x="40" y="96" width="270" height="78" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="52" y="118" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">UI and voice</text><text x="52" y="137" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">React · worker, consumer or union</text><rect x="330" y="96" width="270" height="78" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="342" y="118" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Agent core</text><text x="342" y="137" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">@gigsync/core · router, jobs, mail</text><rect x="40" y="186" width="270" height="78" rx="6" fill="#e2f4ea" stroke="#087a45" stroke-width="1.2"/><text x="52" y="208" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Policy checker</text><text x="52" y="227" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">the worker's own rules · no AI</text><rect x="330" y="186" width="270" height="78" rx="6" fill="#e6e7fb" stroke="#4a4ec4" stroke-width="1.2"/><text x="342" y="208" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Edge check</text><text x="342" y="227" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">PII gate before anything leaves</text><text x="342" y="244" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">no AI</text><rect x="40" y="276" width="270" height="78" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="52" y="298" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Ledger and payments</text><text x="52" y="317" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">jobs, receipts, UPI QR</text><rect x="330" y="276" width="270" height="78" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="342" y="298" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Offline model (optional)</text><text x="342" y="317" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">gigsync-llm: LiteRT-LM, Apple</text><text x="342" y="334" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">Foundation Models, web engine</text><rect x="40" y="366" width="270" height="78" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="52" y="388" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Speech and translation</text><text x="52" y="407" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">IndicConformer, IndicTrans2</text><text x="52" y="424" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">optional, on the device</text><rect x="330" y="366" width="270" height="78" rx="6" fill="#e6e7fb" stroke="#4a4ec4" stroke-width="1.2"/><text x="342" y="388" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Encrypted store</text><text x="342" y="407" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">SQLCipher · encrypted IndexedDB</text><text x="342" y="424" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">on the web</text><rect x="40" y="456" width="270" height="78" rx="6" fill="#e6e7fb" stroke="#4a4ec4" stroke-width="1.2"/><text x="52" y="478" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Device keys</text><text x="52" y="497" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">Keystore / Keychain</text><text x="52" y="514" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">Ed25519 sign · X25519 seal</text><rect x="330" y="456" width="270" height="78" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="342" y="478" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Background responder</text><text x="342" y="497" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">Kotlin · same rules</text><text x="342" y="514" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">answers while the app is closed</text><text x="40" y="594" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">The agent core reaches every part through an interface (a port), so each can be swapped or left out.</text><rect x="720" y="56" width="440" height="320" rx="8" fill="none" stroke="#6b6b66" stroke-width="1" stroke-dasharray="6 4"/><text x="734" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b6b66" text-anchor="start" letter-spacing="0.06em">GIGSYNC CLOUD (CLOUDFLARE)</text><rect x="740" y="96" width="190" height="70" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="1.2" stroke-dasharray="6 4"/><text x="752" y="118" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">API Worker</text><text x="752" y="137" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">sign-in, device keys, limits</text><rect x="950" y="96" width="190" height="70" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="1.2" stroke-dasharray="6 4"/><text x="962" y="118" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Mailbox</text><text x="962" y="137" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">one per user · sealed only</text><rect x="740" y="186" width="190" height="70" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="1.2" stroke-dasharray="6 4"/><text x="752" y="208" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Notifier</text><text x="752" y="227" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">queue → push, no content</text><rect x="950" y="186" width="190" height="70" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="1.2" stroke-dasharray="6 4"/><text x="962" y="208" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Job board</text><text x="962" y="227" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">public profiles, open jobs</text><rect x="740" y="276" width="190" height="70" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="1.2" stroke-dasharray="6 4"/><text x="752" y="298" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">ONDC relay</text><text x="752" y="317" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">rides and delivery</text><rect x="950" y="276" width="190" height="70" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="1.2" stroke-dasharray="6 4"/><text x="962" y="298" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Web app host</text><text x="962" y="317" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">serves the web build</text><line x1="600" y1="135" x2="740" y2="131" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><text x="670" y="126" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">sealed</text><rect x="740" y="420" width="190" height="64" rx="6" fill="#efefec" stroke="#cfcfc9" stroke-width="1.2"/><text x="752" y="442" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Push (FCM / APNs)</text><text x="752" y="461" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">wake-up, no content</text><rect x="950" y="420" width="190" height="64" rx="6" fill="#efefec" stroke="#cfcfc9" stroke-width="1.2"/><text x="962" y="442" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">ONDC network</text><text x="962" y="461" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">open network</text><line x1="835" y1="256" x2="835" y2="420" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><line x1="1045" y1="346" x2="1045" y2="420" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><line x1="740" y1="460" x2="600" y2="495" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="670" y="470.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">wake-up</text>
</svg>
