<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="1120" height="630" role="img" aria-label="A job is agreed, message by message">
<title>A job is agreed, message by message</title>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker>
</defs>
<rect width="1120" height="630" fill="#f7f7f5"/>
<text x="24" y="34" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#0a0a0a" text-anchor="start">A job is agreed, message by message</text>
<rect x="75" y="60" width="190" height="40" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="170" y="85" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="middle">Consumer's phone</text><line x1="170" y1="100" x2="170" y2="560" stroke="#cfcfc9" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="335" y="60" width="190" height="40" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="430" y="85" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="middle">Mailbox (cloud)</text><line x1="430" y1="100" x2="430" y2="560" stroke="#cfcfc9" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="595" y="60" width="190" height="40" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="690" y="85" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="middle">Notifier (cloud)</text><line x1="690" y1="100" x2="690" y2="560" stroke="#cfcfc9" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="855" y="60" width="190" height="40" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="950" y="85" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="middle">Worker's phone</text><line x1="950" y1="100" x2="950" y2="560" stroke="#cfcfc9" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="170" y1="140" x2="430" y2="140" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="300" y="133" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">1 sealed job request: hours, area</text><line x1="430" y1="195" x2="690" y2="195" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="560" y="188" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">2 wake-up queued</text><line x1="690" y1="250" x2="950" y2="250" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="820" y="243" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">3 push, no content</text><line x1="950" y1="305" x2="430" y2="305" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="690" y="298" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">4 fetch, verify, unseal</text><rect x="790" y="330" width="320" height="34" rx="4" fill="#ffe4f1" stroke="#c4126e" stroke-width="1"/><text x="950" y="351" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="middle">5 rules check · the worker taps yes</text><line x1="950" y1="400" x2="430" y2="400" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="690" y="393" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">6 sealed offer or counter-offer</text><line x1="430" y1="455" x2="170" y2="455" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="300" y="448" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">7 delivered, then deleted</text><line x1="170" y1="510" x2="430" y2="510" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="300" y="503" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">8 agree (terms hash), signed</text><line x1="430" y1="540" x2="950" y2="540" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="690" y="533" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">agree</text><rect x="75" y="570" width="970" height="36" rx="4" fill="#e2f4ea" stroke="#087a45" stroke-width="1"/><text x="560" y="592" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="middle">9 both phones sign the same terms and keep them · the worker's contact is shared only now, until the job ends</text>
</svg>
