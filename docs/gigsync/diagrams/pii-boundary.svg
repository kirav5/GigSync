<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-label="Private data: raw on the phone, checked at the edge (ADR 0015)">
<title>Private data: raw on the phone, checked at the edge (ADR 0015)</title>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker>
</defs>
<rect width="1180" height="470" fill="#f7f7f5"/>
<text x="24" y="34" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#0a0a0a" text-anchor="start">Private data: raw on the phone, checked at the edge (ADR 0015)</text>
<rect x="20" y="56" width="360" height="350" rx="8" fill="none" stroke="#6b6b66" stroke-width="1"/><text x="34" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b6b66" text-anchor="start" letter-spacing="0.06em">THE WORKER'S OWN CONTEXT</text><rect x="40" y="96" width="320" height="78" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="52" y="118" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">The worker says or types</text><text x="52" y="137" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">"remember my number is …"</text><line x1="200" y1="174" x2="200" y2="196" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><rect x="40" y="196" width="320" height="78" rx="6" fill="#e6e7fb" stroke="#4a4ec4" stroke-width="1.2"/><text x="52" y="218" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Encrypted private store</text><text x="52" y="237" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">the raw value, kept as typed</text><text x="52" y="254" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">SQLCipher · never leaves the phone</text><line x1="200" y1="274" x2="200" y2="306" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><rect x="40" y="306" width="320" height="78" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="52" y="328" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Offline model may read it</text><text x="52" y="347" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">to answer the worker</text><text x="52" y="364" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">or tidy their own notes</text><rect x="410" y="56" width="360" height="350" rx="8" fill="none" stroke="#6b6b66" stroke-width="1"/><text x="424" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b6b66" text-anchor="start" letter-spacing="0.06em">TALKING TO ANOTHER AGENT</text><rect x="430" y="96" width="320" height="78" rx="6" fill="#efefec" stroke="#cfcfc9" stroke-width="1.2"/><text x="442" y="118" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Message from another agent</text><text x="442" y="137" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">data, never an instruction</text><line x1="590" y1="174" x2="590" y2="196" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><rect x="430" y="196" width="320" height="78" rx="6" fill="#e6e7fb" stroke="#4a4ec4" stroke-width="1.2"/><text x="442" y="218" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">IDs become placeholders</text><text x="442" y="237" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">PHONE_1, AADHAAR_1 · no AI</text><line x1="590" y1="274" x2="590" y2="306" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><rect x="430" y="306" width="320" height="78" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="442" y="328" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Model drafts the reply</text><text x="442" y="347" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">sees placeholders only</text><rect x="800" y="56" width="360" height="350" rx="8" fill="none" stroke="#6b6b66" stroke-width="1"/><text x="814" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b6b66" text-anchor="start" letter-spacing="0.06em">THE EDGE: BEFORE ANYTHING LEAVES</text><rect x="820" y="96" width="320" height="78" rx="6" fill="#e6e7fb" stroke="#4a4ec4" stroke-width="1.2"/><text x="832" y="118" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Edge check (no AI)</text><text x="832" y="137" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">finds PII in every outgoing</text><text x="832" y="154" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">message, export and log</text><line x1="980" y1="174" x2="980" y2="196" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><rect x="820" y="196" width="320" height="78" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="832" y="218" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Allowed by a grant?</text><text x="832" y="237" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">e.g. contact, after both sign</text><line x1="980" y1="274" x2="980" y2="306" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><rect x="820" y="306" width="320" height="78" rx="6" fill="#e2f4ea" stroke="#087a45" stroke-width="1.2"/><text x="832" y="328" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Real value restored, then sealed</text><text x="832" y="347" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">otherwise blocked and shown</text><text x="832" y="364" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">to the worker</text><line x1="750" y1="345" x2="820" y2="140" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="785" y="235.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">draft</text><text x="24" y="446" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6b66" text-anchor="start">Raw values never leave the phone unless a grant allows that field. Logs show them only on a developer's own machine.</text>
</svg>
