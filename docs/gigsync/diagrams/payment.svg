<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" role="img" aria-label="The worker gets paid (pilot: UPI QR, no gateway)">
<title>The worker gets paid (pilot: UPI QR, no gateway)</title>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker>
</defs>
<rect width="1040" height="600" fill="#f7f7f5"/>
<text x="24" y="34" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#0a0a0a" text-anchor="start">The worker gets paid (pilot: UPI QR, no gateway)</text>
<rect x="75" y="60" width="190" height="40" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="170" y="85" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="middle">Worker's phone</text><line x1="170" y1="100" x2="170" y2="540" stroke="#cfcfc9" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="425" y="60" width="190" height="40" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="520" y="85" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="middle">Consumer's UPI app</text><line x1="520" y1="100" x2="520" y2="540" stroke="#cfcfc9" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="775" y="60" width="190" height="40" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/><text x="870" y="85" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="middle">Banks (UPI)</text><line x1="870" y1="100" x2="870" y2="540" stroke="#cfcfc9" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="70" y="120" width="200" height="34" rx="4" fill="#ffe4f1" stroke="#c4126e" stroke-width="1"/><text x="170" y="141" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="middle">job agreed · amount set</text><line x1="170" y1="190" x2="520" y2="190" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="345" y="183" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">shows QR: upi://pay?pa=…&amp;am=…</text><line x1="170" y1="240" x2="520" y2="240" stroke="#0a0a0a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="345" y="233" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">or a sealed payment request (remote)</text><line x1="520" y1="300" x2="870" y2="300" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="695" y="293" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">the consumer approves the payment</text><line x1="870" y1="360" x2="170" y2="360" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#head)"/><text x="520" y="353" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">money reaches the worker's bank</text><line x1="520" y1="420" x2="170" y2="420" stroke="#0a0a0a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="345" y="413" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55554f" text-anchor="middle">if on GigSync: 'paid' + UPI reference</text><rect x="40" y="455" width="290" height="34" rx="4" fill="#e2f4ea" stroke="#087a45" stroke-width="1"/><text x="185" y="476" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="middle">the worker taps Received → recorded on the job</text><text x="24" y="578" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6b66" text-anchor="start">No gateway and no fee: GigSync never holds or moves the money (ADR 0011). Planned Android auto-detect: ADR 0012.</text>
</svg>
