name: CI

# Every push to any branch runs the checks, which covers PRs from this repo without running twice.
# Phone builds are manual (mobile-builds.yml); deploys stay in deploy-workers.yml (main only).
on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # Bundles each Worker the way a deploy would, without deploying: catches import and binding errors.
      - run: pnpm build:workers
      - run: pnpm typecheck
      - run: pnpm test
