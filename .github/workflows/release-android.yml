name: Release Android

# A v* tag builds a signed bundle and uploads it to the Play internal track. Skips until the signing secrets exist:
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The API address baked into the app build. Set the API_BASE repository variable to move it (e.g. a custom domain).
      VITE_API_BASE: ${{ vars.API_BASE || 'https://api.gigsync.network' }}
      # Real SMS sign-in codes through Firebase (docs/setup/firebase-phone-sign-in.md), from repository variables.
      # Unset, the app signs in with the API's dev code.
      VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skipped (no signing secrets yet)
        if: env.HAS_SIGNING != 'true'
        run: echo "Add the Android signing and Play secrets to release."
      - uses: pnpm/action-setup@v4
        if: env.HAS_SIGNING == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SIGNING == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        if: env.HAS_SIGNING == 'true'
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm --filter @gigsync/mobile exec cap sync android
        if: env.HAS_SIGNING == 'true'
      - name: Decode keystore
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/mobile/android/release.keystore
      - name: Build signed bundle
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/mobile/android
        run: >
          ./gradlew bundleRelease --no-daemon
          -Pandroid.injected.signing.store.file=$PWD/release.keystore
          -Pandroid.injected.signing.store.password='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          -Pandroid.injected.signing.key.alias='${{ secrets.ANDROID_KEY_ALIAS }}'
          -Pandroid.injected.signing.key.password='${{ secrets.ANDROID_KEY_PASSWORD }}'
      - uses: r0adkll/upload-google-play@v1
        if: env.HAS_SIGNING == 'true'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.gigsync
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
