name: Deploy Workers

# Every push to main deploys the pilot. Skips cleanly until the Cloudflare secrets exist.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # The API address baked into the app build. Set the API_BASE repository variable to move it (e.g. a custom domain).
      VITE_API_BASE: ${{ vars.API_BASE || 'https://api.gigsync.network' }}
      # The phone's two models as one bundle on GigSync's model host (ADR 0065), the folder of one version, e.g.
      # https://models.gigsync.network/v6/, from `pnpm models:publish`. Unset, the website fetches the embedding model
      # from Hugging Face and has no reader.
      VITE_MODELS_URL: ${{ vars.MODELS_URL }}
      # Real SMS sign-in codes through Firebase (docs/setup/firebase-phone-sign-in.md), from repository variables.
      # Unset, the app signs in with the API's dev code.
      VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gigsync/protocol --filter @gigsync/crypto --filter @gigsync/core build
      - name: Skipped (no Cloudflare secrets yet)
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy."
      # The directory is Neon Postgres (ADR 0013). Migrations run over the direct URL, before the code that needs them.
      - name: Migrate directory
        if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm --filter @gigsync/worker-api db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      - name: Deploy API + Mailbox
        if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm --filter @gigsync/worker-api exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build web app
        if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm build
      - name: Deploy web app (static assets Worker)
        if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm --filter @gigsync/worker-api exec wrangler deploy --config ../../apps/mobile/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Index
        if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm --filter @gigsync/worker-index exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
